name: Deploy Kali Dental Clinic

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site/portfolio
          cp index.html style.css script.js _site/portfolio/
          cp -r assets pages _site/portfolio/
          cp -r "Websites/Kali Dental Clinic/." _site/
          mkdir -p _site/projects
          cp -r "Websites/Abag-dem Electricals" _site/projects/abag-dem-electricals
          cp -r "Websites/Abag-dem Plumbing" _site/projects/abag-dem-plumbing
          cp -r "Websites/Dripfix demo" _site/projects/dripfix
          cp -r "Websites/Eagle eye pest control demo" _site/projects/eagle-eye-pest-control
          cp -r "Websites/Voltguard" _site/projects/voltguard
          cp -r "Websites/QB roofing" _site/projects/qb-roofing
          cp -r "Websites/Zion boreholes" _site/projects/zion-boreholes
          cp -r "Websites/Next Gen Plumbing" _site/projects/next-gen-plumbing
          cp -r "Websites/Standard roofing system demo" _site/projects/standard-roofing
          cp -r "Websites/Starlight roofing demp" _site/projects/starlight-roofing
          cp -r "Websites/Holiness plumbing v2" _site/projects/holiness-plumbing

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
